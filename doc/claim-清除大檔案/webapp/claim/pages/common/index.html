<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<script type="text/javascript">
	function CloseWin() {
		var ua = navigator.userAgent
		var ie = navigator.appName == "Microsoft Internet Explorer" ? true
				: false
		if (ie) {
			var IEversion = parseFloat(ua.substring(ua.indexOf("MSIE ") + 5, ua
					.indexOf(";", ua.indexOf("MSIE "))))
			if (IEversion < 5.5) {
				var str = '<object id=noTipClose classid="clsid:ADB880A6-D8FF-11CF-9377-00AA003B7A11">'
				str += '<param name="Command" value="Close"></object>';
				document.body.insertAdjacentHTML("beforeEnd", str);
				document.all.noTipClose.Click();
			} else {
				window.opener = null;
				window.close();
			}
		} else {
			window.close();
		}
	}
</script>
</head>
<body onload="CloseWin();">
	<script>
		window
				.open(
						"/claim/index.jsp",
						null,
						'left=0,top=0,height=768,width=1024,status=yes,toolbar=no,menubar=no,location=no,resizable=1');
	</script>
</body>
</html>

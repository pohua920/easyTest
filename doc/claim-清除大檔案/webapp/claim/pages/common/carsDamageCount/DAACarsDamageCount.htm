<script language=javascript>
	function check() {
		//有責車必須錄入
		if ((checkInput("fullCarMark", "有責方號牌號碼"))
				&& (checkInput("fullCarMarkType", "有責方號牌種類"))
				&& (checkInput("fullMoney", "有責方損失金額"))) {
			var objs = document.getElementsByName("fullCarMark");
			if (objs.length == 1) { //有責車只錄入一條，無責車也必須錄入
				if ((checkInput("nullCarMark", "無責方號牌號碼"))
						&& (checkInput("nullCarMarkType", "無責方號牌種類"))
						&& (checkInput("nullMoney", "無責方損失金額"))) {
					window
							.open(
									'result/prepaycalculateresult.htm',
									'',
									'width=800,height=600,left=0,top=0,toolbar=no, menubar=no, scrollbars=yes,resizable=no,location=no, status=no');
				}
			} else {
				if ((checkInput2("nullCarMark", "無責方號牌號碼"))
						|| (checkInput2("nullCarMarkType", "無責方號牌種類"))
						|| (checkInput2("nullMoney", "無責方損失金額"))) {
					//無責車有記錄錄入，則檢查數據是否錄入完整
					if ((checkInput("nullCarMark", "無責方號牌號碼"))
							&& (checkInput("nullCarMarkType", "無責方號牌種類"))
							&& (checkInput("nullMoney", "無責方損失金額"))) {
						window
								.open(
										'result/prepaycalculateresult.htm',
										'',
										'width=800,height=600,left=0,top=0,toolbar=no, menubar=no, scrollbars=yes,resizable=no,location=no, status=no');
					}
				} else {
					window
							.open(
									'result/prepaycalculateresult.htm',
									'',
									'width=800,height=600,left=0,top=0,toolbar=no, menubar=no, scrollbars=yes,resizable=no,location=no, status=no');
				}
			}
		}
	}
	function checkInput(name, objName) {
		var objs = document.getElementsByName(name)
		for ( var i = 0; i < objs.length; i++) {
			if (objs[i].value == "") {
				var num = (parseInt(i) + parseInt(1)).toString()
				num = (num.length == 1) ? ("0" + num) : num
				alert(objName.substr(0, 3) + num + objName.substr(3) + "不能為空");
				return false
			}
		}
		return true;
	}
	function checkInput2(name, objName) {
		var objs = document.getElementsByName(name);
		for ( var i = 0; i < objs.length; i++) {
			if (objs[i].value != "") {
				return true;
			}
		}
		return false;
	}
	function showNum(tableName, numName) {
		var type = (tableName.charAt(0) == "n") ? "無" : "有"
		var obj = document.getElementById(tableName);
		var objNum = parseInt(document.getElementById(numName).value)
		if ((isNaN(objNum)) || (objNum < 1) || (objNum > 99)) {
			alert("輸入的數字不能為空，並且不能小於1,大於99")//代码限制死了为99，如果数量比较大，程序要改，会有可能有效率问题
			return;
		}
		var objTr = obj.childNodes[0].childNodes[0].cloneNode(true);
		for ( var i = (obj.childNodes[0].childNodes.length - 1); i > -1; i--) {
			obj.childNodes[0].childNodes[i].removeNode(true);
		}
		for ( var i = 0; i < objNum; i++) {
			if (i == 0) {
				obj.childNodes[0].appendChild(objTr);
			} else {
				var objTrTemp = objTr.cloneNode(true);
				objTrTemp.childNodes[0].innerHTML = "·" + type + "責方"
						+ changeNum(i) + "：";
				obj.childNodes[0].appendChild(objTrTemp);
			}

		}

	}
	function changeNum(str) {
		str = parseInt(str) + parseInt(1)
		str = str.toString();
		return (str.length == 1) ? ("0" + str) : str

	}
	function resetForm() {
		var obj1 = document.getElementById("fullNum").value = "1"
		var obj2 = document.getElementById("nullNum").value = "1"
		document.getElementById("fullButton").click();
		document.getElementById("nullButton").click();
	}
